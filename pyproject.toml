[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-system"
version = "1.0.0"
description = "按 B 站视频《使用Python构建RAG系统》复现的本地 RAG 系统"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers>=5.0.0",
    "chromadb>=1.0.15",
    "google-genai>=1.24.0",
    "python-dotenv>=1.1.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rag = "rag_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
