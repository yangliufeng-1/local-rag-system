<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地 RAG 知识库</title>
<style>
  :root { color-scheme: light; --bg:#f6f7fb; --card:#fff; --text:#1f2430; --muted:#687084; --line:#e4e7ef; --accent:#3b5bdb; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  .wrap { max-width:880px; margin:32px auto; padding:0 16px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(20,30,60,.04); }
  textarea { width:100%; min-height:84px; resize:vertical; border:1px solid var(--line); border-radius:8px; padding:12px; font:inherit; color:var(--text); background:#fff; }
  textarea:focus { outline:2px solid rgba(59,91,219,.25); border-color:var(--accent); }
  .row { display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 18px; cursor:pointer; font:inherit; }
  button:disabled { opacity:.55; cursor:wait; }
  button.ghost { background:#edf0f8; color:var(--text); }
  .meta { font-size:12px; color:var(--muted); }
  .answer { white-space:pre-wrap; line-height:1.75; }
  .source { border-left:3px solid var(--accent); background:#f8f9fd; padding:10px 12px; border-radius:0 8px 8px 0; margin:10px 0; font-size:13px; line-height:1.6; }
  .tag { display:inline-block; font-size:11px; padding:2px 8px; border-radius:99px; background:#edf0f8; color:var(--muted); margin-right:6px; }
  .error { color:#c0392b; }
</style>
</head>
<body>
<div class="wrap">
  <h1>本地 RAG 知识库</h1>
  <div class="sub">分片 → Embedding → Chroma 召回 → CrossEncoder 重排 → 大模型生成</div>

  <div class="card">
    <textarea id="question" placeholder="输入你的问题，例如：哆啦A梦使用的3个秘密道具分别是什么？">哆啦A梦使用的3个秘密道具分别是什么？</textarea>
    <div class="row">
      <button id="askBtn">提问</button>
      <button id="sampleBtn" class="ghost">填入示例问题</button>
      <span id="status" class="meta"></span>
    </div>
  </div>

  <div class="card" id="resultCard" hidden>
    <div class="row" style="margin:0 0 12px">
      <span class="tag" id="backend"></span>
      <span class="tag" id="timing"></span>
    </div>
    <div class="answer" id="answer"></div>
    <h3 style="font-size:14px;margin-top:22px">引用片段（重排后）</h3>
    <div id="sources"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
$('sampleBtn').onclick = () => { $('question').value = '哆啦A梦使用的3个秘密道具分别是什么？'; };

async function ask() {
  const question = $('question').value.trim();
  if (!question) return;
  $('askBtn').disabled = true;
  $('status').textContent = '检索并生成中…';
  try {
    const resp = await fetch('/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question})
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    $('resultCard').hidden = false;
    $('backend').textContent = '后端：' + data.backend;
    $('timing').textContent = '耗时：' + data.timings_ms.total_ms + ' ms';
    $('answer').textContent = data.answer;
    $('sources').innerHTML = data.sources.map((s, i) =>
      `<div class="source"><b>[${i + 1}] score=${Number(s.score).toFixed(4)}</b><br>${escapeHtml(s.text)}</div>`
    ).join('');
    $('status').textContent = '';
  } catch (e) {
    $('status').className = 'meta error';
    $('status').textContent = '请求失败：' + e.message;
  } finally {
    $('askBtn').disabled = false;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

$('askBtn').onclick = ask;
$('question').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) ask();
});
</script>
</body>
</html>
